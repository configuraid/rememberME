<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RememberMe - Einladung öffnen</title>
    
    <!-- Open Graph für schöne Vorschau in WhatsApp/iMessage -->
    <meta property="og:title" content="RememberMe - Gedenkseite">
    <meta property="og:description" content="Du wurdest eingeladen, eine Gedenkseite anzusehen.">
    <meta property="og:type" content="website">
    <!-- <meta property="og:image" content="https://DEINE-DOMAIN.web.app/share-image.png"> -->
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
        }
        
        .container {
            text-align: center;
            max-width: 400px;
        }
        
        .icon {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 40px;
        }
        
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        
        p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 32px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: #a855f7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 24px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .button {
            display: inline-block;
            background: #a855f7;
            color: white;
            padding: 16px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(168, 85, 247, 0.4);
        }
        
        .store-links {
            margin-top: 32px;
            padding-top: 32px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .store-links p {
            font-size: 14px;
            margin-bottom: 16px;
        }
        
        .store-badges {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .store-badges img {
            height: 44px;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">💜</div>
        
        <!-- Loading State -->
        <div id="loading">
            <div class="spinner"></div>
            <h1>App wird geöffnet...</h1>
            <p>Du wirst gleich zur RememberMe App weitergeleitet.</p>
        </div>
        
        <!-- Fallback State (wenn App nicht installiert) -->
        <div id="fallback" class="hidden">
            <h1>RememberMe App benötigt</h1>
            <p>Um diese Gedenkseite zu öffnen, benötigst du die RememberMe App.</p>
            
            <a href="#" id="retryButton" class="button">
                Erneut versuchen
            </a>
            
            <div class="store-links">
                <p>App noch nicht installiert?</p>
                <div class="store-badges">
                    <!-- Ersetze mit echten Store Links -->
                    <a href="https://apps.apple.com/app/id123456789" target="_blank">
                        <img src="https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/de-de" alt="App Store">
                    </a>
                    <a href="https://play.google.com/store/apps/details?id=com.rememberme.app" target="_blank">
                        <img src="https://play.google.com/intl/en_us/badges/static/images/badges/de_badge_web_generic.png" alt="Google Play" style="height: 64px; margin: -10px;">
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Token aus URL extrahieren
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token') || window.location.pathname.split('/').pop();
        
        // Deep Link URL
        const deepLink = `rememberme://invite/${token}`;
        
        // Funktion zum Öffnen der App
        function openApp() {
            // Versuche die App zu öffnen
            window.location.href = deepLink;
            
            // Nach 2 Sekunden: Zeige Fallback wenn App nicht geöffnet wurde
            setTimeout(() => {
                // Wenn wir noch hier sind, wurde die App nicht geöffnet
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('fallback').classList.remove('hidden');
            }, 2000);
        }
        
        // Retry Button
        document.getElementById('retryButton').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('fallback').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');
            openApp();
        });
        
        // Sofort versuchen die App zu öffnen
        if (token) {
            openApp();
        } else {
            // Kein Token - zeige Fehler
            document.getElementById('loading').innerHTML = `
                <h1>Ungültiger Link</h1>
                <p>Dieser Einladungslink ist ungültig oder abgelaufen.</p>
            `;
        }
    </script>
</body>
</html>
