name: rememberme
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  bloc: ^9.1.0
  equatable: ^2.0.5
  
  # Firebase
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  firebase_storage: ^13.0.4

  # UI & Design
  cupertino_icons: ^1.0.6

  # Utilities
  image_picker: ^1.2.1
  package_info_plus: ^9.0.0 
  url_launcher: ^6.2.1
  uuid: ^4.5.2
  mobile_scanner: ^7.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true